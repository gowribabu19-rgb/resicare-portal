<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Valley Apartments - Resident Desk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-building-user text-3xl text-indigo-200"></i>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Green Valley Apartments</h1>
          <p class="text-indigo-200 text-sm">Smart Resident Portal</p>
        </div>
      </div>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-100">
      <h2 class="text-xl font-bold mb-6 text-slate-800">Submit Service Request</h2>
      <form id="ticketForm" onsubmit="handleFormSubmit(event)">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <input type="text" id="name" required placeholder="Full Name" class="border p-2.5 rounded-lg text-sm">
          <input type="email" id="email" required placeholder="Email" class="border p-2.5 rounded-lg text-sm">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
          <input type="tel" id="phone" required placeholder="Phone" class="border p-2.5 rounded-lg text-sm">
          <select id="block" required class="border p-2.5 rounded-lg text-sm bg-white">
            <option value="Block A">Block A</option>
            <option value="Block B">Block B</option>
            <option value="Block C">Block C</option>
          </select>
          <input type="text" id="flat" required placeholder="Flat #" class="border p-2.5 rounded-lg text-sm">
        </div>
        <select id="category" required class="w-full border p-2.5 rounded-lg text-sm bg-white mb-4">
          <option value="Plumbing">Plumbing</option>
          <option value="Electrical">Electrical</option>
          <option value="Carpentry">Carpentry</option>
          <option value="General Maintenance">General Maintenance</option>
        </select>
        <textarea id="description" required placeholder="Issue description..." class="w-full border p-2.5 rounded-lg text-sm mb-4"></textarea>
        <div class="p-4 bg-slate-50 border rounded-lg mb-6">
          <label class="block text-xs font-bold mb-1">Access Code (RESICARE2026)</label>
          <input type="password" id="accessCode" required class="border p-2 rounded-lg w-full">
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg">Submit Request</button>
      </form>
      <div id="submitResult" class="hidden mt-6 p-4 rounded-lg"></div>
    </div>
  </main>
  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1bJQ7BcVFEzxBF9I6DO0gfqyX3c7lJrdMgPMcWZFRVrNPf5z7RCUm-pdt9zHbsC_S/exec";

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const resDiv = document.getElementById('submitResult');
      btn.disabled = true;
      btn.innerText = "Submitting...";

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        block: document.getElementById('block').value,
        flat: document.getElementById('flat').value,
        category: document.getElementById('category').value,
        description: document.getElementById('description').value,
        accessCode: document.getElementById('accessCode').value
      };

      try {
        const finalUrl = APPS_SCRIPT_URL + "?action=submit&payload=" + encodeURIComponent(JSON.stringify(payload));
        const response = await fetch(finalUrl);
        const res = await response.json();

        if (res.success) {
          resDiv.className = "mt-6 p-4 bg-green-100 text-green-800 rounded-lg";
          resDiv.innerHTML = "<strong>Success!</strong> Ticket ID: " + res.requestId;
          document.getElementById('ticketForm').reset();
        } else {
          resDiv.className = "mt-6 p-4 bg-red-100 text-red-800 rounded-lg";
          resDiv.innerHTML = "<strong>Error:</strong> " + res.error;
        }
      } catch (err) {
        resDiv.className = "mt-6 p-4 bg-red-100 text-red-800 rounded-lg";
        resDiv.innerHTML = "<strong>Network Error:</strong> Check if your URL ends with /exec";
      } finally {
        btn.disabled = false;
        btn.innerText = "Submit Request";
        resDiv.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
