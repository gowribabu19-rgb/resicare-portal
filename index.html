<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Valley Apartments - Smart Resident Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-indigo-700 text-white py-6 shadow-md">
    <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-building"></i> Green Valley Apartments
        </h1>
        <p class="text-indigo-200 text-sm">Smart Resident Service Portal</p>
      </div>
      <span class="bg-indigo-800 text-indigo-100 text-xs px-3 py-1 rounded-full border border-indigo-500">
        <i class="fa-solid fa-shield-halved text-emerald-400"></i> ResiCare Active
      </span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">

    <!-- LIVE INCIDENT BANNER CONTAINER -->
    <div id="bannerContainer" class="mb-6 hidden"></div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-slate-300 mb-6 bg-white rounded-t-lg shadow-sm">
      <button id="tabRaise" onclick="switchTab('raise')" class="flex-1 py-4 text-center font-semibold text-indigo-700 border-b-2 border-indigo-700 flex items-center justify-center gap-2">
        <i class="fa-solid fa-circle-plus"></i> Raise Service Request
      </button>
      <button id="tabTrack" onclick="switchTab('track')" class="flex-1 py-4 text-center font-semibold text-slate-500 hover:text-indigo-600 flex items-center justify-center gap-2">
        <i class="fa-solid fa-magnifying-glass"></i> Track Ticket Status
      </button>
    </div>

    <!-- TAB 1: RAISE TICKET FORM -->
    <div id="viewRaise" class="bg-white rounded-b-lg p-6 shadow-md border border-slate-200">
      <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-pen-to-square text-indigo-600"></i> Submit Service Request
      </h2>
      
      <form id="ticketForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        
        <!-- Honeypot Bot Trap (Hidden) -->
        <div style="display:none;">
          <input type="text" id="website_trap" name="website_trap">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name *</label>
            <input type="text" id="name" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address *</label>
            <input type="email" id="email" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number *</label>
            <input type="tel" id="phone" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Block *</label>
            <select id="block" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              <option value="Block A">Block A</option>
              <option value="Block B">Block B</option>
              <option value="Block C">Block C</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Flat # *</label>
            <input type="text" id="flat" required placeholder="e.g. 101" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Category *</label>
            <select id="category" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              <option value="Plumbing">Plumbing</option>
              <option value="Electrical">Electrical</option>
              <option value="Carpentry">Carpentry</option>
              <option value="General Maintenance">General Maintenance</option>
              <option value="Security & Safety">Security & Safety</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Urgency Level *</label>
            <select id="urgency" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              <option value="Low">Low (Routine)</option>
              <option value="Medium" selected>Medium (Standard)</option>
              <option value="High">High (Urgent Attention)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Issue Description *</label>
          <textarea id="description" rows="3" required placeholder="Describe the problem..." class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <div class="bg-indigo-50 p-4 rounded-md border border-indigo-100">
          <label class="block text-xs font-bold text-indigo-900 mb-1">Resident Access Code *</label>
          <input type="text" id="accessCode" required placeholder="Enter Community Code (RESICARE2026)" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none bg-white uppercase">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-md transition duration-200 shadow-md flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> Submit Request
        </button>

      </form>
    </div>

    <!-- TAB 2: TRACK TICKET STATUS -->
    <div id="viewTrack" class="bg-white rounded-b-lg p-6 shadow-md border border-slate-200 hidden">
      <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-magnifying-glass text-indigo-600"></i> Track Ticket Progress
      </h2>
      <p class="text-xs text-slate-500 mb-4">Enter your unique Request ID (e.g. AFM-2026-0001) to check live status.</p>

      <div class="flex gap-2 mb-6">
        <input type="text" id="trackIdInput" placeholder="Enter Request ID (e.g., AFM-2026-0001)" class="flex-1 px-4 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none uppercase font-mono">
        <button onclick="trackTicket()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-md font-bold shadow-md transition duration-200 flex items-center gap-2">
          <i class="fa-solid fa-search"></i> Track
        </button>
      </div>

      <div id="trackResult" class="hidden"></div>
    </div>

  </main>

  <!-- JS SCRIPT ENGINE -->
  <script>
    // ⚠️ PASTE YOUR NEW GOOGLE APPS SCRIPT WEB APP URL BELOW:
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJEXKMeYUxTDAgKtgaSX_i63_IngXD9j3B4hpWMW45cf-o8oMO64pddJGGRBZ3SkUP/exec";

    document.addEventListener("DOMContentLoaded", () => {
      fetchIncidents();
    });

    function switchTab(tab) {
      const tabRaise = document.getElementById('tabRaise');
      const tabTrack = document.getElementById('tabTrack');
      const viewRaise = document.getElementById('viewRaise');
      const viewTrack = document.getElementById('viewTrack');

      if (tab === 'raise') {
        viewRaise.classList.remove('hidden');
        viewTrack.classList.add('hidden');
        tabRaise.className = "flex-1 py-4 text-center font-semibold text-indigo-700 border-b-2 border-indigo-700 flex items-center justify-center gap-2";
        tabTrack.className = "flex-1 py-4 text-center font-semibold text-slate-500 hover:text-indigo-600 flex items-center justify-center gap-2";
      } else {
        viewRaise.classList.add('hidden');
        viewTrack.classList.remove('hidden');
        tabTrack.className = "flex-1 py-4 text-center font-semibold text-indigo-700 border-b-2 border-indigo-700 flex items-center justify-center gap-2";
        tabRaise.className = "flex-1 py-4 text-center font-semibold text-slate-500 hover:text-indigo-600 flex items-center justify-center gap-2";
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Submitting...`;

      const params = new URLSearchParams({
        action: 'submit',
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        block: document.getElementById('block').value,
        flat: document.getElementById('flat').value.trim(),
        category: document.getElementById('category').value,
        urgency: document.getElementById('urgency').value,
        description: document.getElementById('description').value.trim(),
        access_code: document.getElementById('accessCode').value.toUpperCase().trim(),
        website_trap: document.getElementById('website_trap').value
      });

      try {
        const url = `${APPS_SCRIPT_URL}?${params.toString()}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.success) {
          alert(`🎉 Ticket Submitted Successfully!\n\nYour Request ID: ${data.requestId}\n\nSave this ID to track your status later.`);
          document.getElementById('ticketForm').reset();
        } else {
          alert(`❌ Error: ${data.message || 'Could not submit ticket.'}`);
        }
      } catch (err) {
        alert(`❌ Network Error: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Submit Request`;
      }
    }

    async function trackTicket() {
      const requestId = document.getElementById('trackIdInput').value.trim();
      const resultDiv = document.getElementById('trackResult');
      
      if (!requestId) {
        alert("Please enter a Request ID.");
        return;
      }

      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `<div class="p-4 text-center text-slate-500"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching status...</div>`;

      try {
        const url = `${APPS_SCRIPT_URL}?action=track&requestId=${encodeURIComponent(requestId)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.success) {
          resultDiv.innerHTML = `
            <div class="bg-slate-50 p-6 rounded-lg border border-slate-200">
              <div class="flex justify-between items-center mb-4">
                <span class="text-sm font-bold text-slate-500 font-mono">${data.requestId}</span>
                <span class="px-3 py-1 rounded-full text-xs font-bold ${data.status === 'Resolved' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                  ${data.status || 'New'}
                </span>
              </div>
              <div class="grid grid-cols-2 gap-4 text-sm">
                <div><strong class="text-slate-600">Category:</strong> ${data.category || 'N/A'}</div>
                <div><strong class="text-slate-600">Priority:</strong> ${data.priority || 'Pending'}</div>
                <div><strong class="text-slate-600">Assigned Team:</strong> ${data.team || 'Pending'}</div>
                <div><strong class="text-slate-600">Due At:</strong> ${data.dueAt || 'N/A'}</div>
              </div>
            </div>
          `;
        } else {
          resultDiv.innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-md border border-red-200"><i class="fa-solid fa-triangle-exclamation"></i> ${data.message || 'Ticket not found.'}</div>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-md">Error retrieving status.</div>`;
      }
    }

    async function fetchIncidents() {
      try {
        const url = `${APPS_SCRIPT_URL}?action=banner`;
        const res = await fetch(url);
        const data = await res.json();

        const rawIncidents = data.incidents || [];
        
        if (rawIncidents.length > 0) {
          // Deduplicate by Block + Category
          const uniqueIncidents = {};
          rawIncidents.forEach(inc => {
            const key = `${inc.block}___${inc.category}`;
            if (!uniqueIncidents[key]) uniqueIncidents[key] = inc;
          });

          const container = document.getElementById('bannerContainer');
          container.classList.remove('hidden');
          
          let bannerHtml = '';
          Object.values(uniqueIncidents).forEach(inc => {
            bannerHtml += `
              <div class="bg-rose-600 text-white p-4 rounded-lg shadow-md border-l-8 border-rose-900 flex items-start gap-3 mb-2">
                <i class="fa-solid fa-triangle-exclamation text-2xl mt-1 text-amber-300"></i>
                <div>
                  <h3 class="font-bold text-md text-amber-200">LIVE BUILDING INCIDENT: ${inc.block} (${inc.category})</h3>
                  <p class="text-sm text-rose-100 mt-1">${inc.message}</p>
                  <div class="text-xs text-rose-200 mt-2"><strong>Status:</strong> ${inc.status} | <strong>ETA:</strong> ${inc.eta}</div>
                </div>
              </div>
            `;
          });
          container.innerHTML = bannerHtml;
        }
      } catch (e) {
        console.log("No active banner.");
      }
    }
  </script>
</body>
</html>
